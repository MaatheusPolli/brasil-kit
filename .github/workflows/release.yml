name: Release

# Manual de propósito: nenhum push/merge publica no npm automaticamente.
# Publicação via npm trusted publishing (OIDC): sem NPM_TOKEN salvo no GitHub.
# Pré-requisito: o pacote precisa existir no npm e ter o trusted publisher
# configurado para este repositório e este arquivo (release.yml).
# Para publicar: Actions → Release → Run workflow.
on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Trusted publishing exige npm CLI 11.5.1+; o npm que vem com o Node 22 é mais antigo.
      # Não usar registry-url aqui: o setup-node grava um .npmrc com token e impede o OIDC.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      - uses: changesets/action@v1
        with:
          publish: npx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
