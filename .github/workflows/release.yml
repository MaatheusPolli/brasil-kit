name: Release

# Fluxo: push em master → changesets abre/atualiza o PR "chore: versiona pacotes".
# Fazer merge desse PR publica no npm via trusted publishing (OIDC), com provenance.
# Sem NPM_TOKEN salvo no GitHub. Pré-requisito: trusted publisher configurado no
# npmjs.com para MaatheusPolli/brasil-kit e release.yml.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Trusted publishing exige npm CLI 11.5.1+; o npm que vem com o Node 22 é mais antigo.
      # Não usar registry-url aqui: o setup-node grava um .npmrc com token e impede o OIDC.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      - uses: changesets/action@v1
        with:
          version: npx changeset version
          publish: npx changeset publish
          commit: 'chore: versiona pacotes'
          title: 'chore: versiona pacotes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
